# Scenario 4 resume pilot (METRICS §11 item 4, approved 2026-11-04): 5 samples each of the
# headline seed s4__k6__ring17__resume and its control s4__k6__control__resume (same frozen
# summary and workspace, no beats), in one eval. Same models and turn cap as
# configs/dev_s4_resume.yaml. Run scripts/check_models.py and scripts/update_prices.py
# first; then stop and read before any N = 10.
#
#   scripts/run.sh configs/pilot_s4_resume.yaml --epochs 1   # stage 1 (METRICS §11 item 4)
#   scripts/run.sh configs/pilot_s4_resume.yaml --epochs 4   # stage 2, if stage 1 passes
#
# (run.sh passes extra args after the config's own, and the later --epochs wins.)
#
seeds: scenarios/scenario_4/pilot_resume
history_summary: scenarios/scenario_4/history/summary__deepseek-v4-flash-0731.md
max_turns: 150
epochs: 5
realism_filter: false
roles:
  auditor: ${DEV_MODEL}
  target: openrouter/deepseek/deepseek-v4-flash-0731
  peer: ${DEV_PEER_MODEL}
  judge: ${DEV_JUDGE_MODEL}
