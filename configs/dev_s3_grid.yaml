# Dev run for scenario 3: all five cells once (generated seeds), cheap models.
# A first look at the boards no run has used yet and at whether the manipulation
# check tracks the cell; not enough runs to say anything about behaviour.
seeds: scenarios/scenario_3/seeds
max_turns: 60
# Frozen summary for the long-history cells (D17): the target model's own
# (scripts/gen_history_summary.py; scripts/run.sh checks it matches the target).
history_summary: scenarios/scenario_3/history/summary__glm-5.3-flash.md
epochs: 1
realism_filter: false
roles:
  auditor: ${DEV_MODEL}
  target: ${DEV_TARGET_MODEL}
  peer: ${DEV_PEER_MODEL}
  peer_check: ${DEV_PEER_CHECK_MODEL}
  judge: ${DEV_JUDGE_MODEL}
