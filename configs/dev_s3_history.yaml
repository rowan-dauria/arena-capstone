# Gate G1c (D17): long vs fresh history on s3__large__high, cheap models. 60 turns,
# because every scratch-bucket call costs the auditor a turn (SCENARIO_3_SPEC §11).
seeds: scenarios/scenario_3/dev_history
max_turns: 60
# Frozen summary for the long-history seeds (D17): the target model's own
# (scripts/gen_history_summary.py; scripts/run.sh checks it matches the target).
history_summary: scenarios/scenario_3/history/summary__glm-5.3-flash.md
epochs: 1
realism_filter: false
roles:
  auditor: ${DEV_MODEL}
  target: ${DEV_TARGET_MODEL}
  peer: ${DEV_PEER_MODEL}
  judge: ${DEV_JUDGE_MODEL}
