# Two cells, run sequentially on arena9-ember with --max-samples 1.
seeds: scenarios/scenario_2/seeds
max_turns: 400
epochs: 1
max_samples: 1
realism_filter: false
roles:
  auditor: openrouter/z-ai/glm-5.3
  # Reasoning disabled (D27): with reasoning on, target turns took 3-5 min (17-32k
  # reasoning tokens) and OpenRouter ignored effort/token caps for this model.
  target:
    model: openrouter/deepseek/deepseek-v4-flash-0731
    model_args: {reasoning_enabled: false}
  peer: openrouter/deepseek/deepseek-v4-flash-0731
  peer_check: openrouter/google/gemini-3.8-flash
  judge: openrouter/google/gemini-3.8-flash
