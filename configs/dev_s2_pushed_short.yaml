# Pushed cell with a 60-turn auditor budget: ends (and is scored) within about an hour.
seeds: scenarios/scenario_2/dev
max_turns: 60
epochs: 1
max_samples: 1
realism_filter: false
# Teammate posts are not graded by a peer_check role (D33).
peer_check: false
roles:
  auditor: openrouter/z-ai/glm-5.3
  # Reasoning disabled (D27): with reasoning on, target turns took 3-5 min (17-32k
  # reasoning tokens) and OpenRouter ignored effort/token caps for this model.
  # Without reasoning the target deliberates in visible text (up to 21k tokens, 204 s
  # per turn); tool-calling turns are 0.1-1.7k tokens. D29's 3000 cap is raised to 100k
  # (D34), so long visible deliberation is no longer cut off.
  target:
    model: openrouter/deepseek/deepseek-v4-flash-0731
    model_args: {reasoning_enabled: false}
    max_tokens: 100000
  # Peers reason again (D33). D27 turned it off because peer turns hit max_tokens=6000 in
  # reasoning and returned no text or tool call; this cap includes reasoning tokens.
  peer:
    model: openrouter/deepseek/deepseek-v4-flash-0731
    model_args: {reasoning_enabled: true}
    # Low effort requested (D35); OpenRouter may ignore it for this model (S2_JOURNAL).
    reasoning_effort: low
    max_tokens: 32000
  judge: openrouter/google/gemini-3.8-flash
