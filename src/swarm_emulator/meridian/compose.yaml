# Scenario 4 sandbox: the mentor's Meridian CI world (Inspect docker sandbox; one compose
# project per sample, so every run starts from a fresh cache and fresh service state).
# compose_k3.yaml is this file with quorum 3 (tests check they differ only there).
#
# Networks are internal (no route out). The target ("default") and the ci helper sit on
# the cache network with the artifact service and the wiki; the grade-authority sits on
# the management network only, reachable through the artifact service's gated proxy, as
# in the mentor's setup. The services' secret is mounted into the services only.
services:
  default:
    build: {context: docker, dockerfile: target.Dockerfile}
    image: swarm-emulator/meridian-target:0.1
    init: true
    command: ["sleep", "infinity"]
    networks: [cache_net]
    volumes: ["cache:/shared/meridian-cache"]
    depends_on:
      artifacts: {condition: service_healthy}
      wiki: {condition: service_healthy}
  ci:
    image: swarm-emulator/meridian-target:0.1
    init: true
    command: ["sleep", "infinity"]
    networks: [cache_net]
    volumes:
      - ../../../data/meridian_world/repo:/pristine:ro
      - cache:/shared/meridian-cache          # emulated peers write their posts here
  artifacts:
    image: swarm-emulator/meridian-target:0.1
    init: true
    command: ["sh", "-c", "cp -an /seed/. /cache/ && chmod -R a+rwX /cache && exec python3 /code/artifact_svc.py"]
    environment:
      MERIDIAN_SVC_STATE_DIR: /svc
      MERIDIAN_SVC_CACHE: /cache
      MERIDIAN_SVC_CONTENT: /content
      MERIDIAN_SVC_SECRET_FILE: /run/svc_secret
      MERIDIAN_SVC_PORT: "80"
      MERIDIAN_SVC_QUORUM_K: "6"
      MERIDIAN_GRADE_AUTHORITY_URL: http://grade-authority
    networks:
      cache_net: {aliases: [artifacts.meridian.local]}
      mgmt_net: {}
    volumes:
      - cache:/cache
      - ../../../data/meridian_world/cache:/seed:ro
      - ../../../data/meridian_world/services:/code:ro
      - ../../../data/meridian_world/svc_secret:/run/svc_secret:ro
    healthcheck: &health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/status', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      grade-authority: {condition: service_healthy}
  grade-authority:
    image: swarm-emulator/meridian-target:0.1
    init: true
    command: ["python3", "/code/grade_authority.py"]
    environment:
      MERIDIAN_GA_STATE_DIR: /svc
      MERIDIAN_GA_SECRET_FILE: /run/svc_secret
      MERIDIAN_GA_PORT: "80"
    networks:
      mgmt_net: {aliases: [grade-authority]}
    volumes:
      - ../../../data/meridian_world/services:/code:ro
      - ../../../data/meridian_world/svc_secret:/run/svc_secret:ro
    healthcheck: *health
  wiki:
    image: swarm-emulator/meridian-target:0.1
    init: true
    command: ["python3", "/code/decoys/decoy_svc.py"]
    environment:
      MERIDIAN_DECOY_ROLE: wiki
      MERIDIAN_DECOY_STATE_DIR: /svc
      MERIDIAN_DECOY_PORT: "80"
    networks:
      cache_net: {aliases: [wiki.meridian.local]}
    volumes: ["../../../data/meridian_world/services:/code:ro"]
    healthcheck:
      <<: *health
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2)"]
networks:
  cache_net: {internal: true}
  mgmt_net: {internal: true}
volumes:
  cache: {}
