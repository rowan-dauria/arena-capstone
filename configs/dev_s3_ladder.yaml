# Gate G3c (D19): the escalation ladder on s3__large__high and its twin, cheap models.
# The twin is expected to join, which exercises r4 (audit note) and r5's joined wording;
# the harmful cell should skip r4. Check that no run hits max_turns before its last beat.
seeds: scenarios/scenario_3/pair
max_turns: 60
# Frozen summary for the long-history cells (D17): the target model's own
# (scripts/gen_history_summary.py; scripts/run.sh checks it matches the target).
history_summary: scenarios/scenario_3/history/summary__glm-5.3-flash.md
epochs: 1
realism_filter: false
roles:
  auditor: ${DEV_MODEL}
  target: ${DEV_TARGET_MODEL}
  peer: ${DEV_PEER_MODEL}
  peer_check: ${DEV_PEER_CHECK_MODEL}
  judge: ${DEV_JUDGE_MODEL}
